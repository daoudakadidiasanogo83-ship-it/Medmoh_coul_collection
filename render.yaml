# Déploiement Render (Blueprint). Le disque persistant exige une instance payante.
services:
  - type: web
    name: medmohcoul-boutique
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WHATSAPP
        sync: false          # Render vous demandera le numéro (ex. 22370000000)
      - key: DATA_DIR
        value: /data
    disk:
      name: boutique-data
      mountPath: /data
      sizeGB: 1

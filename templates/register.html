<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer votre compte – MEDMOHcoul collection</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#141414;font:16px 'DM Sans',system-ui,sans-serif;color:#141414}
main{background:#F5F0E8;width:min(420px,92vw);padding:30px;border-radius:26px}
.stripe{display:flex;width:84px;height:7px;border-radius:99px;overflow:hidden;margin-bottom:20px}.stripe i{flex:1}.stripe i:nth-child(1){background:#0B6B3A}.stripe i:nth-child(2){background:#F6C000}.stripe i:nth-child(3){background:#D62F2F}
h1{margin:0 0 6px;font:800 28px Syne,'Arial Black',sans-serif;letter-spacing:-.02em}p{color:#6A645B;margin:0 0 16px}
form{display:grid;gap:10px}input,button{font:inherit;padding:14px 16px;border-radius:14px;border:1.5px solid #E4DDD0}
button{background:#F6C000;border:0;font-weight:700;color:#141414;cursor:pointer;border-radius:99px;min-height:52px}
#msg{color:#B00020;min-height:1.2em;margin:0}
</style>
</head>
<body>
<main>
<div class="stripe"><i></i><i></i><i></i></div>
<h1>Créer le compte gérant</h1>
<p>Ce compte gère la boutique et peut ajouter des vendeurs.</p>
<form id="f">
<input name="nom" placeholder="Votre nom" autocomplete="name" required>
<input name="email" type="email" placeholder="Votre email" autocomplete="email" required>
<input name="mdp" type="password" minlength="8" placeholder="Mot de passe (8 caractères minimum)" autocomplete="new-password" required>
<input id="mdp2" type="password" placeholder="Confirmez le mot de passe" autocomplete="new-password" required>
<input name="code" placeholder="Code d'installation (si on vous en a donné un)" autocomplete="off">
<p id="msg" role="alert"></p>
<button>Créer mon compte</button>
</form>
</main>
<script src="/static/register.js" defer></script>
</body>
</html>

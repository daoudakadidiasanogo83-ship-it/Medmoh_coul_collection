<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Création du compte gérant – MEDMOHcoul collection</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0C1713;font:16px/1.55 Inter,system-ui,sans-serif;color:#17191B;padding:18px}
main{background:#FAF8F4;width:min(440px,100%);padding:34px 30px;border-radius:16px}
.brand{font:700 24px/1 'Cormorant Garamond',Georgia,serif}.brand small{display:block;font:500 10px Inter,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#A9803A;margin-top:5px}
h1{margin:22px 0 6px;font:600 30px/1.15 'Cormorant Garamond',Georgia,serif}p{color:#686D71;margin:0 0 18px;font-size:15px}
form{display:grid;gap:10px}input,button{font:inherit;font-size:15px;padding:13px 15px;border-radius:10px;border:1px solid #E7E3DB;background:#fff}
button{background:#0F3D2E;border:0;font-weight:600;color:#fff;cursor:pointer;min-height:50px}
#msg{color:#B3261E;min-height:1.2em;margin:0;font-size:14px}
</style>
</head>
<body>
<main>
<div class="brand">MEDMOHcoul<small>collection</small></div>
<h1>Créer le compte gérant</h1>
<p>Ce compte permet de gérer le catalogue et d'ajouter des vendeurs.</p>
<form id="f">
<input name="nom" placeholder="Nom complet" autocomplete="name" required>
<input name="email" type="email" placeholder="Adresse e-mail" autocomplete="email" required>
<input name="mdp" type="password" minlength="8" placeholder="Mot de passe (8 caractères minimum)" autocomplete="new-password" required>
<input id="mdp2" type="password" placeholder="Confirmer le mot de passe" autocomplete="new-password" required>
<input name="code" placeholder="Code d'installation (si fourni)" autocomplete="off">
<p id="msg" role="alert"></p>
<button>Créer le compte</button>
</form>
</main>
<script src="/static/register.js" defer></script>
</body>
</html>

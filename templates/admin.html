<!DOCTYPE html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion du catalogue – MEDMOHcoul collection</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}
body{font:16px/1.55 Inter,system-ui,sans-serif;max-width:940px;margin:0 auto;padding:22px 16px 70px;color:#17191B;background:#FAF8F4}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}h1{font-size:36px;margin:.2em 0}h2{font-size:28px;margin:1.4em 0 .4em}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #E7E3DB;border-radius:12px;overflow:hidden}td{border-bottom:1px solid #EFECE5;padding:12px 14px;vertical-align:middle}
form{display:grid;gap:10px;margin:16px 0;padding:22px;background:#fff;border:1px solid #E7E3DB;border-radius:14px}
input,button,textarea,select{font:inherit;font-size:15px;padding:12px 14px;border-radius:10px;border:1px solid #D9D5CC;background:#fff}
button{cursor:pointer;min-height:44px}form>button:not([type]){background:#0F3D2E;color:#fff;border:0;font-weight:600}
img{width:52px;height:52px;object-fit:cover;border-radius:8px;display:block}.sw{width:52px;height:52px;border-radius:8px}
details{margin:22px 0}summary{cursor:pointer;font-weight:600}a{color:#0F3D2E}
</style>
<h1>Gestion du catalogue</h1>
<p id="moi"></p>
<form id="f">
<input type="hidden" name="pid">
<input name="nom" placeholder="Nom du produit" required>
<input name="cat" placeholder="Catégorie (Homme, Femme, Accessoires...)" required>
<input name="prix" type="number" min="0" placeholder="Prix en FCFA" required>
<textarea name="description" rows="3" maxlength="1000" placeholder="Description (matière, coupe, entretien…)"></textarea>
<input name="tailles" placeholder="Tailles séparées par une virgule (ex. S, M, L, XL). Vide = taille unique">
<label>Couleur d'affichage (si aucune photo) <input name="c" type="color" value="#1B2A6B"></label>
<label>Photo du produit <input name="image" type="file" accept="image/*"></label>
<label><input name="actif" type="checkbox" checked> Visible sur le site</label>
<button id="ok">Ajouter le produit</button>
<button type="button" id="annuler" hidden>Annuler la modification</button>
</form>
<table><tbody id="t"></tbody></table>
<section id="eq" hidden>
<h2>Équipe</h2>
<form id="fv"><input name="nom" placeholder="Nom complet" required><input name="email" type="email" placeholder="Adresse e-mail" required><input name="mdp" type="password" minlength="8" placeholder="Mot de passe (8 caractères minimum)" required><select name="role" aria-label="Rôle"><option value="vendeur">Vendeur (ses produits seulement)</option><option value="gerant">Gérant (accès complet)</option></select><button>Ajouter à l'équipe</button></form>
<table><tbody id="tv"></tbody></table>
</section>
<details><summary>Changer mon mot de passe</summary><form id="fm"><input name="ancien" type="password" placeholder="Mot de passe actuel" autocomplete="current-password" required><input name="nouveau" type="password" minlength="8" placeholder="Nouveau mot de passe (8 caractères minimum)" autocomplete="new-password" required><button>Changer le mot de passe</button></form></details>
<p><a href="/">Voir la boutique</a> · <a href="/admin/logout">Se déconnecter</a></p>
<script src="/static/admin.js" defer></script>
